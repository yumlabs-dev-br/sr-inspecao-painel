name: CI

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tipos (API, painel e contratos)
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build do painel
        run: npm run build
